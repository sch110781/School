<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة انضباط المعلمين</title>
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- خط Cairo وأيقونات Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --moe-primary: #006a55;       /* اللون الأخضر الرسمي لهوية وزارة التعليم */
            --moe-secondary: #005040;     /* درجة أغمق للتدرج والتحويم */
            --moe-gold: #D4AF37;          /* الذهبي لللمسات */
            --bg-light: #F4F7F6;          /* خلفية الصفحة */
            --text-dark: #2B363B;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            direction: rtl;
            padding-bottom: 40px;
        }

        /* الهيدر العلوي */
        .moe-header {
            background: linear-gradient(135deg, var(--moe-primary), var(--moe-secondary));
            color: white;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 4px solid var(--moe-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .moe-header .logo-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .moe-header .moe-logo {
            height: 55px;
            width: auto;
            filter: brightness(0) invert(1); /* تحويل اللوجو للون الأبيض ليتناسب مع الخلفية */
        }

        .moe-header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 720px;
            margin: 25px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 106, 85, 0.08);
            border: 1px solid rgba(0, 106, 85, 0.08);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--moe-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #EBF1F0;
        }

        .section-title i {
            color: var(--moe-gold);
        }

        /* شبكة النماذج مرتبة */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--moe-primary);
            font-size: 14px;
        }

        label i {
            color: var(--moe-primary);
            width: 16px;
        }

        select, input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.25s ease;
            background-color: #FAFCFC;
            color: #2D3748;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--moe-primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(0, 106, 85, 0.12);
        }

        input[readonly] {
            background-color: #EDF2F4;
            color: #718096;
            cursor: not-allowed;
            border-color: #CBD5E0;
        }

        /* الأزرار */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--moe-primary), var(--moe-secondary));
            color: white;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 106, 85, 0.2);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--moe-secondary), #00382d);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 106, 85, 0.3);
        }

        /* رسالة النجاح */
        .alert-success {
            background: #E6F4EA;
            color: #137333;
            border: 1px solid #CEEAD6;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }

        /* تصميم الجدول المطور */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: var(--moe-primary);
            color: white;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            border-bottom: 2px solid var(--moe-gold);
        }

        td {
            padding: 11px 10px;
            text-align: center;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:nth-child(even) {
            background-color: #F8FAFC;
        }

        tr:hover {
            background-color: #F0F7F6;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }
    
        .auth-container[hidden], #appContainer[hidden] { display: none !important; }
        .auth-note { color: #64748b; font-size: 13px; line-height: 1.8; margin-top: 12px; }
        .auth-error { display: none; color: #b42318; background: #fff1f0; border: 1px solid #ffd7d2; border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 13px; }
        .auth-secondary { width: 100%; margin-top: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: white; color: var(--moe-primary); font: 600 14px 'Cairo', sans-serif; cursor: pointer; }
        .auth-secondary:hover, .btn-logout:hover { background: #f0f7f6; }
        .btn-logout { margin-top: 10px; padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 8px; background: white; color: var(--moe-primary); font: 600 13px 'Cairo', sans-serif; cursor: pointer; }
    </style>
</head>
<body>

<!-- رأس الصفحة -->
<header class="moe-header">
    <div class="logo-title">
        <img src="https://upload.wikimedia.org/wikipedia/ar/1/17/Saudi_Ministry_of_Education_Logo_2025.png" alt="شعار التعليم" class="moe-logo">
        <h1>نظام متابعة انضباط المعلمين</h1>
    </div>
</header>

<div id="authContainer" class="container auth-container">
    <div class="section-title">
        <i class="fa-solid fa-lock"></i>
        <span>تسجيل الدخول</span>
    </div>
    <form id="passwordLoginForm" autocomplete="on">
        <div class="form-group">
            <label for="phoneNumber"><i class="fa-solid fa-mobile-screen-button"></i> رقم الجوال بصيغة دولية:</label>
            <input type="tel" id="phoneNumber" inputmode="tel" autocomplete="username" placeholder="+9665XXXXXXXX" required>
        </div>
        <div class="form-group">
            <label for="password"><i class="fa-solid fa-key"></i> كلمة المرور الخاصة بك:</label>
            <input type="password" id="password" autocomplete="current-password" minlength="6" required>
        </div>
        <button class="btn-submit" type="submit"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
    </form>
    <div id="authError" class="auth-error" role="alert"></div>
    <p class="auth-note">الحسابات ينشئها المسؤول يدويًا، ولكل مستخدم كلمة مرور خاصة. عند نسيانها، يطلب من المسؤول إعادة تعيينها.</p>
</div>

<div id="appContainer" class="container" hidden>
    
    <div class="section-title">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>إدخال بيانات الحضور والغياب</span>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label><i class="fa-regular fa-calendar-days"></i> التاريخ (هجري وميلادي):</label>
            <input type="text" id="date" readonly>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-calendar-day"></i> اليوم:</label>
            <input type="text" id="day" readonly>
        </div>

        <div class="form-group full-width">
            <label><i class="fa-solid fa-user-shield"></i> اسم المشرف (المُدخل):</label>
            <input type="text" id="observer" placeholder="اكتب اسم المشرف هنا" oninput="updateDayAndFilter()">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-layer-group"></i> الخلية:</label>
            <select id="cell">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-clock"></i> الحصة:</label>
            <select id="period">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-school"></i> الصف:</label>
            <select id="grade">
                <option>أول ثانوي</option>
                <option>ثاني ثانوي</option>
                <option>ثالث ثانوي</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-door-closed"></i> الفصل:</label>
            <select id="classroom">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label><i class="fa-solid fa-chalkboard-user"></i> اسم المعلم:</label>
            <select id="teacher">
                <option>أحمد هزازي</option>
                <option>أحمد الخميس</option>
                <option>جبهان الشمري</option>
                <option>حسن العيدروس</option>
                <option>زيد الهيلي</option>
                <option>سامر الفهمي</option>
                <option>سعود الخماش</option>
                <option>سلطان المالكي</option>
                <option>سلمان الحربي</option>
                <option>صالح القرني</option>
                <option>طارق الحارثي</option>
                <option>عبدالاله الغامدي</option>
                <option>عبدالعزيز السبيعي</option>
                <option>عبدالله الدوسري</option>
                <option>عبدالله الحارثي</option>
                <option>عثمان الفارس</option>
                <option>علي الأسمري</option>
                <option>فهد الزومان</option>
                <option>فهد الحارثي</option>
                <option>فيصل الشهري</option>
                <option>ماجد المطيري</option>
                <option>مبارك الوقداني</option>
                <option>محمد بن داود</option>
                <option>محمد الفراج</option>
                <option>محمد النصار</option>
                <option>محمد العمري</option>
                <option>محمد السبيعي</option>
                <option>محمد الغامدي</option>
                <option>مشبب الأحمري</option>
                <option>موسى البعداني</option>
                <option>وليد السلمي</option>
                <option>وليد الأمير</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label><i class="fa-solid fa-clipboard-check"></i> حالة الحضور:</label>
            <select id="status">
                <option value="لم يحضر">لم يحضر</option>
                <option value="متأخر 15 دقيقة">متأخر 15 دقيقة</option>
                <option value="متأخر 20 دقيقة">متأخر 20 دقيقة</option>
                <option value="متأخر 30 دقيقة">متأخر 30 دقيقة</option>
                <option value="مستأذن">مستأذن</option>
            </select>
        </div>
    </div>

    <button class="btn-submit" onclick="saveData()">
        <i class="fa-solid fa-floppy-disk"></i> تسجيل البيانات
    </button>
    
    <div id="successMsg" class="alert-success">
        <i class="fa-solid fa-circle-check"></i> تم تسجيل البيانات بنجاح!
    </div>

    <div class="section-title" style="margin-top: 35px;">
        <i class="fa-solid fa-list-check"></i>
        <span>إدخالاتك لهذا اليوم</span>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>الخلية</th>
                    <th>الحصة</th>
                    <th>الصف</th>
                    <th>الفصل</th>
                    <th>المعلم</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="myTodayRecords"></tbody>
        </table>
    </div>

    <div class="footer-note">
        نظام تسجيل الحضور والانضباط الميداني<br>
        <button id="signOutButton" type="button" class="btn-logout">تسجيل الخروج</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        // أدخل apiKey محليًا من إعدادات Firebase؛ لا ترسله في المحادثة.
        apiKey: "PASTE_FIREBASE_WEB_API_KEY_HERE",
        authDomain: "school1-29236.firebaseapp.com",
        databaseURL: "https://school1-29236-default-rtdb.firebaseio.com",
        projectId: "school1-29236",
        storageBucket: "school1-29236.firebasestorage.app",
        messagingSenderId: "479051477085",
        appId: "1:479051477085:web:a366101c5515b9c692ddb4"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    const authContainer = document.getElementById('authContainer');
    const appContainer = document.getElementById('appContainer');
    const authError = document.getElementById('authError');
    let attendanceRef = null;
    let currentAttendanceSnapshot = null;
    let pendingAuthMessage = '';

    function showAuthError(message) {
        authError.textContent = message;
        authError.style.display = 'block';
    }

    function authErrorMessage(error) {
        const code = error && error.code;
        if (code === 'auth/invalid-email') return 'رقم الجوال غير صحيح. اكتبه بصيغة دولية مثل +9665XXXXXXXX.';
        if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'رقم الجوال أو كلمة المرور غير صحيحة.';
        if (code === 'auth/user-disabled') return 'هذا الحساب موقوف. تواصل مع المسؤول.';
        if (code === 'auth/operation-not-allowed') return 'فعّل Email/Password في طرق تسجيل الدخول ضمن Firebase Authentication.';
        if (code === 'auth/too-many-requests') return 'تكررت المحاولات. انتظر قليلًا ثم حاول مجددًا.';
        if (code === 'auth/network-request-failed') return 'تعذر الاتصال. تحقق من الشبكة وحاول مجددًا.';
        return 'تعذر تسجيل الدخول. تحقق من رقم الجوال وكلمة المرور.';
    }

    function firebaseEmailForPhone(phoneNumber) {
        const digits = phoneNumber.replace(/\D/g, '');
        return 'u' + digits + '@school1-29236.firebaseapp.com';
    }

    async function signInWithPassword(event) {
        event.preventDefault();
        authError.style.display = 'none';
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        if (!/^\+[1-9]\d{7,14}$/.test(phoneNumber)) {
            showAuthError('اكتب رقم الجوال بصيغة دولية، مثل +9665XXXXXXXX.');
            return;
        }

        const password = document.getElementById('password').value;
        if (!password) {
            showAuthError('اكتب كلمة المرور الخاصة بك.');
            return;
        }
        const submitButton = document.querySelector('#passwordLoginForm button[type=\"submit\"]');
        submitButton.disabled = true;
        try {
            await auth.signInWithEmailAndPassword(firebaseEmailForPhone(phoneNumber), password);
        } catch (error) {
            showAuthError(authErrorMessage(error));
        } finally {
            submitButton.disabled = false;
        }
    }

    document.getElementById('passwordLoginForm').addEventListener('submit', signInWithPassword);

    document.getElementById('signOutButton').addEventListener('click', () => auth.signOut());

    function updateDayAndFilter() {
        const now = new Date();
        const dateParts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit'
        }).formatToParts(now);
        const parts = Object.fromEntries(dateParts.map(({ type, value }) => [type, value]));
        const gregorianDate = `${parts.year}-${parts.month}-${parts.day}`;
        const gregorianDisplay = new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {
            timeZone: 'Asia/Riyadh', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
        const hijriDisplay = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
            timeZone: 'Asia/Riyadh', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
        const dayDisplay = new Intl.DateTimeFormat('ar-SA', {
            timeZone: 'Asia/Riyadh', weekday: 'long'
        }).format(now);

        const dateInput = document.getElementById('date');
        dateInput.value = `${gregorianDisplay} | ${hijriDisplay}`;
        dateInput.dataset.gregorianDate = gregorianDate;
        document.getElementById('day').value = dayDisplay;

        const obs = document.getElementById('observer').value.trim();
        if (obs && auth.currentUser) {
            localStorage.setItem(`observer_name_${auth.currentUser.uid}`, obs);
        }
        renderTodayRecords(currentAttendanceSnapshot);
    }

    function renderTodayRecords(snapshot) {
        const tableBody = document.getElementById('myTodayRecords');
        tableBody.replaceChildren();
        const currentObserver = document.getElementById('observer').value.trim();
        const currentDate = document.getElementById('date').dataset.gregorianDate;
        if (!snapshot || !currentObserver || !currentDate || !auth.currentUser) return;

        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val() || {};
            if (data.observer !== currentObserver || data.date !== currentDate) return;
            const row = document.createElement('tr');
            [data.cell, data.period, data.grade, data.classroom, data.teacher].forEach((value) => {
                const cell = document.createElement('td');
                cell.textContent = value || '-';
                row.appendChild(cell);
            });
            const statusCell = document.createElement('td');
            const status = document.createElement('strong');
            status.textContent = data.status || '-';
            statusCell.appendChild(status);
            row.appendChild(statusCell);
            tableBody.prepend(row);
        });
    }

    function saveData() {
        const user = auth.currentUser;
        const observerName = document.getElementById('observer').value.trim();
        if (!user || !attendanceRef) {
            alert('انتهت جلسة الدخول. سجّل الدخول مجددًا.');
            return;
        }
        if (!observerName) {
            alert('يرجى إدخال اسم المشرف أولاً');
            return;
        }

        const record = {
            date: document.getElementById('date').dataset.gregorianDate,
            day: document.getElementById('day').value,
            observer: observerName,
            cell: document.getElementById('cell').value,
            period: document.getElementById('period').value,
            grade: document.getElementById('grade').value,
            classroom: document.getElementById('classroom').value,
            teacher: document.getElementById('teacher').value,
            status: document.getElementById('status').value,
            timestamp: Date.now()
        };

        attendanceRef.push(record)
            .then(() => {
                const msg = document.getElementById('successMsg');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            })
            .catch(() => alert('تعذر حفظ البيانات. تحقق من تسجيل الدخول وقواعد قاعدة البيانات.'));
    }

    auth.onAuthStateChanged(async (user) => {
        authError.style.display = 'none';
        if (attendanceRef) attendanceRef.off('value');
        attendanceRef = null;
        currentAttendanceSnapshot = null;
        document.getElementById('myTodayRecords').replaceChildren();

        if (!user) {
            appContainer.hidden = true;
            authContainer.hidden = false;
            if (pendingAuthMessage) {
                showAuthError(pendingAuthMessage);
                pendingAuthMessage = '';
            }
            return;
        }

        try {
            const access = await database.ref(`authorizedUsers/${user.uid}`).once('value');
            if (access.val() !== true) {
                pendingAuthMessage = 'هذا الرقم غير مصرّح له بعد. أضف UID الحساب إلى authorizedUsers في قاعدة البيانات.';
                await auth.signOut();
                return;
            }
        } catch (error) {
            pendingAuthMessage = 'تعذر التحقق من صلاحية الرقم. تحقق من نشر قواعد Realtime Database.';
            await auth.signOut();
            return;
        }

        authContainer.hidden = true;
        appContainer.hidden = false;
        document.getElementById('observer').value = localStorage.getItem(`observer_name_${user.uid}`) || '';
        updateDayAndFilter();

        // كل حساب يقرأ ويكتب سجلاته فقط تحت UID الخاص به.
        attendanceRef = database.ref(`users/${user.uid}/attendance`);
        attendanceRef.on('value', (snapshot) => {
            currentAttendanceSnapshot = snapshot;
            renderTodayRecords(snapshot);
        }, () => {
            alert('تعذر تحميل سجلات هذا الحساب. تحقق من نشر قواعد Realtime Database.');
        });
    });
