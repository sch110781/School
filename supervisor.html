<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الوكيل - متابعة حضور المعلمين</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f9; padding: 20px; direction: rtl; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2, h3 { text-align: center; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #34495e; color: white; }
        .stats-table th { background: #2980b9; }
        .badge-present { background: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-absent { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin: 0 auto 20px auto;
        }
        .btn-delete:hover { background: #c0392b; }

        .filter-container {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .filter-container label { font-weight: bold; color: #2c3e50; }
        .filter-container select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم الوكيل - المتابعة اللحظية</h2>

    <!-- زر التصفير -->
    <button class="btn-delete" onclick="clearAllData()">🗑️ مسح جميع البيانات والإحصائيات</button>

    <h3>إحصائيات المعلمين</h3>
    <table class="stats-table">
        <thead>
            <tr>
                <th>اسم المعلم</th>
                <th>إجمالي مرات الحضور</th>
                <th>إجمالي مرات الغياب</th>
            </tr>
        </thead>
        <tbody id="statsTableBody"></tbody>
    </table>

    <h3>سجل الإدخالات المباشر</h3>
    
    <!-- فلتر تصنيف الخلايا -->
    <div class="filter-container">
        <label for="cellFilter">تصفية حسب الخلية:</label>
        <select id="cellFilter" onchange="renderData()">
            <option value="all">جميع الخلايا</option>
            <option value="1">الخلية 1</option>
            <option value="2">الخلية 2</option>
            <option value="3">الخلية 3</option>
            <option value="4">الخلية 4</option>
            <option value="5">الخلية 5</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>اليوم</th>
                <th>المراقب</th>
                <th>الخلية</th>
                <th>الحصة</th>
                <th>المعلم</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="recordsTableBody"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAB4-peSNR8dVd2xj4Kv685dVVsiYk4MiU",
        databaseURL: "https://school1-29236-default-rtdb.firebaseio.com",
        projectId: "school1-29236"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let globalSnapshot = null;

    // الاستماع للبيانات وحفظ النسخة للفلترة اللحظية
    database.ref('attendance').on('value', function(snapshot) {
        globalSnapshot = snapshot;
        renderData();
    });

    function renderData() {
        const recordsTableBody = document.getElementById('recordsTableBody');
        const statsTableBody = document.getElementById('statsTableBody');
        const selectedCell = document.getElementById('cellFilter').value;
        
        recordsTableBody.innerHTML = '';
        statsTableBody.innerHTML = '';

        if (!globalSnapshot || !globalSnapshot.exists()) {
            recordsTableBody.innerHTML = '<tr><td colspan="7">لا توجد بيانات مسجلة حتى الآن</td></tr>';
            return;
        }

        const teacherStats = {};

        globalSnapshot.forEach(function(childSnapshot) {
            const data = childSnapshot.val();

            // حساب الإحصائيات الشاملة لكل المعلمين
            if (!teacherStats[data.teacher]) {
                teacherStats[data.teacher] = { present: 0, absent: 0 };
            }
            if (data.status === 'حضر') {
                teacherStats[data.teacher].present++;
            } else {
                teacherStats[data.teacher].absent++;
            }

            // تطبيق فلتر الخلية على الجدول المباشر
            if (selectedCell === 'all' || String(data.cell) === selectedCell) {
                const statusBadge = data.status === 'حضر' 
                    ? '<span class="badge-present">حضر</span>' 
                    : '<span class="badge-absent">لم يحضر</span>';

                const row = '<tr>' +
                    '<td>' + (data.date || '-') + '</td>' +
                    '<td>' + (data.day || '-') + '</td>' +
                    '<td>' + (data.observer || '-') + '</td>' +
                    '<td>' + (data.cell || '-') + '</td>' +
                    '<td>' + (data.period || '-') + '</td>' +
                    '<td>' + (data.teacher || '-') + '</td>' +
                    '<td>' + statusBadge + '</td>' +
                '</tr>';
                
                recordsTableBody.innerHTML = row + recordsTableBody.innerHTML;
            }
        });

        if (recordsTableBody.innerHTML === '') {
            recordsTableBody.innerHTML = '<tr><td colspan="7">لا توجد إدخالات لهذه الخلية حتى الآن</td></tr>';
        }

        // عرض جدول إحصائيات المعلمين
        for (const teacher in teacherStats) {
            const statRow = '<tr>' +
                '<td><strong>' + teacher + '</strong></td>' +
                '<td><span style="color: #27ae60; font-weight: bold;">' + teacherStats[teacher].present + '</span></td>' +
                '<td><span style="color: #e74c3c; font-weight: bold;">' + teacherStats[teacher].absent + '</span></td>' +
            '</tr>';
            statsTableBody.innerHTML += statRow;
        }
    }

    // دالة التصفير
    function clearAllData() {
        if (confirm('هل أنت تأكد من رغبتك في مسح كافة السجلات والإحصائيات؟ لا يمكن التراجع عن هذه الخطوة.')) {
            database.ref('attendance').remove()
                .then(function() {
                    alert('تم مسح جميع البيانات بنجاح!');
                })
                .catch(function(error) {
                    alert('حدث خطأ أثناء المسح: ' + error.message);
                });
        }
    }
</script>

</body>
</html>
