<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الوكيل - متابعة حضور المعلمين</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f9; padding: 20px; direction: rtl; }
        .container { max-width: 1150px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2, h3 { text-align: center; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #34495e; color: white; }
        .stats-table th { background: #2980b9; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: white; display: inline-block; font-size: 12px; }
        .badge-present { background: #27ae60; }
        .badge-absent { background: #e74c3c; }
        .badge-late { background: #e67e22; }
        .badge-permission { background: #3498db; }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin: 0 auto 20px auto;
        }
        .btn-delete:hover { background: #c0392b; }

        .btn-delete-row {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete-row:hover { background: #cc0000; }

        .filter-container {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .filter-container label { font-weight: bold; color: #2c3e50; }
        .filter-container select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم المشرف - المتابعة اللحظية</h2>

    <!-- زر التصفير الكلي -->
    <button class="btn-delete" onclick="clearAllData()">🗑️ مسح جميع البيانات والإحصائيات</button>

    <h3>إحصائيات المعلمين</h3>
    <table class="stats-table">
        <thead>
            <tr>
                <th>اسم المعلم</th>
                <th>حضر</th>
                <th>لم يحضر</th>
                <th>تأخير 15د</th>
                <th>تأخير 20د</th>
                <th>تأخير 30د</th>
                <th>مستأذن</th>
            </tr>
        </thead>
        <tbody id="statsTableBody"></tbody>
    </table>

    <h3>سجل الإدخالات المباشر</h3>
    
    <!-- فلتر تصنيف الخلايا -->
    <div class="filter-container">
        <label for="cellFilter">تصفية حسب الخلية:</label>
        <select id="cellFilter" onchange="renderData()">
            <option value="all">جميع الخلايا</option>
            <option value="1">الخلية 1</option>
            <option value="2">الخلية 2</option>
            <option value="3">الخلية 3</option>
            <option value="4">الخلية 4</option>
            <option value="5">الخلية 5</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>اليوم</th>
                <th>المشرف</th>
                <th>الخلية</th>
                <th>الحصة</th>
                <th>الصف</th>
                <th>الفصل</th>
                <th>المعلم</th>
                <th>الحالة</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="recordsTableBody"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAB4-peSNR8dVd2xj4Kv685dVVsiYk4MiU",
        databaseURL: "https://school1-29236-default-rtdb.firebaseio.com",
        projectId: "school1-29236"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let globalSnapshot = null;

    database.ref('attendance').on('value', function(snapshot) {
        globalSnapshot = snapshot;
        renderData();
    });

    function renderData() {
        const recordsTableBody = document.getElementById('recordsTableBody');
        const statsTableBody = document.getElementById('statsTableBody');
        const selectedCell = document.getElementById('cellFilter').value;
        
        recordsTableBody.innerHTML = '';
        statsTableBody.innerHTML = '';

        if (!globalSnapshot || !globalSnapshot.exists()) {
            recordsTableBody.innerHTML = '<tr><td colspan="10">لا توجد بيانات مسجلة حتى الآن</td></tr>';
            return;
        }

        const teacherStats = {};

        globalSnapshot.forEach(function(childSnapshot) {
            const key = childSnapshot.key;
            const data = childSnapshot.val();

            if (!teacherStats[data.teacher]) {
                teacherStats[data.teacher] = { 
                    present: 0,
                    absent: 0, 
                    late15: 0, 
                    late20: 0, 
                    late30: 0, 
                    permission: 0 
                };
            }

            if (data.status === 'حضر') teacherStats[data.teacher].present++;
            else if (data.status === 'لم يحضر') teacherStats[data.teacher].absent++;
            else if (data.status === 'متأخر 15 دقيقة') teacherStats[data.teacher].late15++;
            else if (data.status === 'متأخر 20 دقيقة') teacherStats[data.teacher].late20++;
            else if (data.status === 'متأخر 30 دقيقة') teacherStats[data.teacher].late30++;
            else if (data.status === 'مستأذن') teacherStats[data.teacher].permission++;

            if (selectedCell === 'all' || String(data.cell) === selectedCell) {
                let badgeClass = 'badge-absent';
                if (data.status === 'حضر') badgeClass = 'badge-present';
                else if (data.status && data.status.includes('متأخر')) badgeClass = 'badge-late';
                else if (data.status === 'مستأذن') badgeClass = 'badge-permission';

                const statusBadge = `<span class="badge ${badgeClass}">${data.status || '-'}</span>`;

                const row = '<tr>' +
                    '<td>' + (data.date || '-') + '</td>' +
                    '<td>' + (data.day || '-') + '</td>' +
                    '<td>' + (data.observer || '-') + '</td>' +
                    '<td>' + (data.cell || '-') + '</td>' +
                    '<td>' + (data.period || '-') + '</td>' +
                    '<td>' + (data.grade || '-') + '</td>' +
                    '<td>' + (data.classroom || '-') + '</td>' +
                    '<td>' + (data.teacher || '-') + '</td>' +
                    '<td>' + statusBadge + '</td>' +
                    '<td><button class="btn-delete-row" onclick="deleteSingleRecord(\'' + key + '\')">🗑️ مسح</button></td>' +
                '</tr>';
                
                recordsTableBody.innerHTML = row + recordsTableBody.innerHTML;
            }
        });

        if (recordsTableBody.innerHTML === '') {
            recordsTableBody.innerHTML = '<tr><td colspan="10">لا توجد إدخالات لهذه الخلية حتى الآن</td></tr>';
        }

        for (const teacher in teacherStats) {
            const stat = teacherStats[teacher];
            const statRow = '<tr>' +
                '<td><strong>' + teacher + '</strong></td>' +
                '<td><span style="color: #27ae60; font-weight: bold;">' + stat.present + '</span></td>' +
                '<td><span style="color: #e74c3c; font-weight: bold;">' + stat.absent + '</span></td>' +
                '<td><span style="color: #e67e22; font-weight: bold;">' + stat.late15 + '</span></td>' +
                '<td><span style="color: #e67e22; font-weight: bold;">' + stat.late20 + '</span></td>' +
                '<td><span style="color: #e67e22; font-weight: bold;">' + stat.late30 + '</span></td>' +
                '<td><span style="color: #3498db; font-weight: bold;">' + stat.permission + '</span></td>' +
            '</tr>';
            statsTableBody.innerHTML += statRow;
        }
    }

    // دالة مسح عنصر فردي محدد
    function deleteSingleRecord(key) {
        if (confirm('هل أنت تأكد من رغبتك في مسح هذا السجل؟')) {
            database.ref('attendance/' + key).remove()
                .then(function() {
                    alert('تم مسح السجل بنجاح!');
                })
                .catch(function(error) {
                    alert('حدث خطأ أثناء المسح: ' + error.message);
                });
        }
    }

    // دالة التصفير الكلي
    function clearAllData() {
        if (confirm('هل أنت تأكد من رغبتك في مسح كافة السجلات والإحصائيات؟ لا يمكن التراجع عن هذه الخطوة.')) {
            database.ref('attendance').remove()
                .then(function() {
                    alert('تم مسح جميع البيانات بنجاح!');
                })
                .catch(function(error) {
                    alert('حدث خطأ أثناء المسح: ' + error.message);
                });
        }
    }
</script>

</body>
</html>
